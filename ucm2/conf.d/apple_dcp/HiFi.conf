# HDMI or DisplayPort output of an Apple Silicon display controller
# (DCP). The monitor's audio is on PCM 0; there is no hardware volume.

SectionDevice."HDMI1" {
	Comment "HDMI / DisplayPort"

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "HDMI/DP Jack"
	}
}
